services:
  - type: web
    name: skylark-bi-agent
    runtime: node
    plan: free
    buildCommand: npx pnpm@10.4.1 install && npx pnpm@10.4.1 build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONDAY_API_TOKEN
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
